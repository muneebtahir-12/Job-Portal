<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB-PORTAL</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
         <nav id="navbar">
        <div class="logo">
            <img src="/Images/logo.png" alt="logo">
             <h1>DevJobs</h1>
        </div>
        <div class="links">
            <a href="#home">Home</a>
            <a href="#jobs">Job</a>
            <a href="#contact">Contact</a>
            <button>SignUp</button>
        </div>
         </nav>
    </header>

    <main>
        <section id="home">
            <img src="/Images/home.png" alt="home">
        </section>
         <section id="jobs">
            <div class="head">
            <h2>Job Listings</h2>
             <div class="offers">
                <select name="job type" id="offer">
                    <option value="all">All</option>
                    <option value="full-time">Full time</option>
                    <option value="part-time">Part Time</option>
                    <option value="Internship">Internship</option>
                </select>
             </div>
            </div>
            <div class="front-ends">
            <div class="front-end full-time">
                <div class="details">
                <h3>Frontend Developer</h3>
                <p>Full-Time | San Francisco, CA</p>
                <a href="web.html">Apply</a>
                </div>
                <img src="/Images/image1.png" alt="">
            </div>
            <div class="front-end part-time">
                <div class="details">
                <h3>Frontend Engineer</h3>
                <p>Part Time | Remote</p>
                <a href="web.html">Apply</a>
                </div>
                <img src="/Images/image2.png" alt="">
            </div>
            <div class="front-end Internship">
                <div class="details">
                <h3>Frontend Development Intern</h3>
                <p>Internship | New York, NY</p>
                <a href="web.html">Apply</a>
                </div>
                <img src="/Images/image3.png" alt="">
            </div>
            </div>
         </section>
    </main>

    <footer id="contact">
       <div class="about">
        <span>About Us</span>
        <span>Privacy Policy</span>
        <span>Terms of Service</span>
       </div>
       <div class="social-media">
        <a href=""><img src="/Images/twitter.png" alt="twitter"></a>
        <a href=""><img src="/Images/linkedIn.png" alt="linkedIn"></a>
        <a href=""><img src="/Images/github.png" alt="github"></a>
       </div>
       <aside>© 2024 DevJobs. All rights reserved.</aside>
    </footer>

    
    <script src="index.js"></script>
</body>
</html>
